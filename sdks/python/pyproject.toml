[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "evalforge"
version = "2.0.0"
description = "Framework-agnostic LLM agent evaluation harness with parallel judge swarm"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/heManKuMAR6/evalforge"

[tool.maturin]
binaries = ["evalforge"]
manifest-path = "../../crates/evalforge-cli/Cargo.toml"
python-source = "."
strip = true

[project.optional-dependencies]
dev = ["pytest>=7.0"]
