name: EvalForge Swarm

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build evalforge CLI
        run: cargo build --release --bin evalforge

      - name: Install evalforge SDK (editable)
        working-directory: sdks/python
        run: |
          pip install --upgrade pip
          pip install aiohttp pytest
          pip install -e .

      - name: Run swarm on PR traces
        env:
          EVALFORGE_BIN: ${{ github.workspace }}/target/release/evalforge
        run: |
          mkdir -p .evalforge/after
          $EVALFORGE_BIN swarm \
            --traces tests/traces \
            --output .evalforge/after \
            --mock

      - name: Download baseline (from main)
        id: baseline
        uses: dawidd6/action-download-artifact@v6
        with:
          name: evalforge-baseline
          branch: main
          path: .evalforge/before
          workflow: evalforge.yml
          if_no_artifact_found: warn

      - name: Post PR diff comment
        if: steps.baseline.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVALFORGE_BIN: ${{ github.workspace }}/target/release/evalforge
        run: |
          $EVALFORGE_BIN diff \
            --before .evalforge/before \
            --after .evalforge/after \
            --post-github-comment

      - name: Upload result as new baseline
        if: github.event.pull_request.merged == true
        uses: actions/upload-artifact@v4
        with:
          name: evalforge-baseline
          path: .evalforge/after
          retention-days: 90
