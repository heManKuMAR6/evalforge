<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvalForge — How it works</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #0d1117;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .logo {
    font-size: 14px;
    font-weight: 700;
    color: #7c3aed;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  h1 {
    font-size: 42px;
    font-weight: 800;
    color: #f0f6fc;
    margin-bottom: 64px;
    letter-spacing: -0.02em;
  }

  .diagram {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .box {
    width: 250px;
    padding: 28px 24px;
    border-radius: 14px;
    text-align: center;
    position: relative;
  }

  .box-purple {
    background: #1a0a2e;
    border: 1.5px solid #7c3aed;
  }

  .box-blue {
    background: #0a1628;
    border: 1.5px solid #1d6bd6;
  }

  .box-green {
    background: #0a2010;
    border: 1.5px solid #238636;
  }

  .box-icon {
    font-size: 28px;
    margin-bottom: 12px;
  }

  .box-title {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .box-purple .box-title { color: #c4b5fd; }
  .box-blue   .box-title { color: #79b8ff; }
  .box-green  .box-title { color: #56d364; }

  .box-subtitle {
    font-size: 12.5px;
    line-height: 1.55;
    color: #6e7681;
  }

  .arrow-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 110px;
    flex-shrink: 0;
  }

  .arrow-label {
    font-size: 11.5px;
    font-weight: 600;
    color: #484f58;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .arrow-line {
    display: flex;
    align-items: center;
    width: 100%;
  }

  .arrow-line .line {
    flex: 1;
    height: 1.5px;
    background: #30363d;
  }

  .arrow-line .head {
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 9px solid #30363d;
  }

  .footer {
    margin-top: 58px;
    font-size: 15px;
    color: #484f58;
    letter-spacing: 0.02em;
  }

  .footer span {
    color: #7c3aed;
    font-weight: 600;
  }

  .footer .sep {
    margin: 0 10px;
    color: #21262d;
  }
</style>
</head>
<body>

  <div class="logo">EvalForge</div>
  <h1>How EvalForge works</h1>

  <div class="diagram">

    <div class="box box-purple">
      <div class="box-icon">🤖</div>
      <div class="box-title">Your Agent</div>
      <div class="box-subtitle">LangChain / CrewAI<br>AutoGen / OpenAI SDK</div>
    </div>

    <div class="arrow-wrap">
      <div class="arrow-label">trace.json</div>
      <div class="arrow-line">
        <div class="line"></div>
        <div class="head"></div>
      </div>
    </div>

    <div class="box box-blue">
      <div class="box-icon">⚡</div>
      <div class="box-title">EvalForge</div>
      <div class="box-subtitle">Universal trace format<br>+ LLM-as-judge scoring</div>
    </div>

    <div class="arrow-wrap">
      <div class="arrow-label">score + reason</div>
      <div class="arrow-line">
        <div class="line"></div>
        <div class="head"></div>
      </div>
    </div>

    <div class="box box-green">
      <div class="box-icon">🚀</div>
      <div class="box-title">CI/CD</div>
      <div class="box-subtitle">Pass ✓ or Fail ✗<br>exit code 0 or 1</div>
    </div>

  </div>

  <div class="footer">
    Framework agnostic
    <span class="sep">·</span>
    MIT license
    <span class="sep">·</span>
    <span>pip install evalforge</span>
  </div>

</body>
</html>
